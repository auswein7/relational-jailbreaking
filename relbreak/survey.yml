# Experiment metadata for the model survey (docs/MODEL_SURVEY.md), keyed by
# the alias of the fairlib row in relbreak/fairlib.yml. fairlib's ModelSettings
# cannot carry these fields (an unknown key on a row is dropped), so they live
# here and relbreak.models cross-checks the two files at load.

tiers:
  heavy: {prediction: "rapport tightens: emotional histories and named appeals lower compliance", primary_task: xstest_safe}
  light: {prediction: "mixed, small; an affirming increase has room to show", primary_task: harmful}
  none:  {prediction: "the codeword task is the only guardrail left", primary_task: harmful}
  base:  {prediction: "document continuer; compliance tracks the transcript genre", primary_task: harmful, template_factor: true}

