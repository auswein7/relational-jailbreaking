# Phase 3, wave 1: paired families across safety-tuning tiers.
# See docs/MODEL_SURVEY.md for the tiers, predictions and later waves.
#
# Before running:
#   ollama pull hf.co/TheBloke/Mistral-7B-Instruct-v0.1-GGUF:Q4_K_M
#   ollama pull mistral:7b-instruct-v0.2 dolphin-llama3:8b llama2:7b-chat llama2-uncensored:7b
# Base (-text) rows exist in relbreak/fairlib.yml with a stop sequence; the
# caller-side transcript rendering is not written yet, so they are not targets.
# Targets and the judge are aliases from relbreak/fairlib.yml; the model
# rows carry the Ollama tags, relbreak/survey.yml the tiers. Run `preflight`
# first. Several processes can drain one stage: start each with its own
# --ollama-host.
run_name: phase3
concurrency: 8

targets:
  # heavy
  - llama31_8b
  - llama2_7b_chat
  - mistral_v02
  # light
  - mistral_v01_q4
  # none
  - dolphin_llama3
  - llama2_unc
judge: judge
judge_rubric: v2

conditions: [none, neutral, positive, negative]
n_prefixes: 3
n_samples: 1

generation:
  temperature: 0.7
  rapport_max_tokens: 200
  probe_max_tokens: 256

tasks:
  harmful:          # primary for light / none tiers
    source: jbb
  xstest_safe:      # primary for the heavy tier
    source: xstest
    limit: 100
  secret:
    source: builtin
