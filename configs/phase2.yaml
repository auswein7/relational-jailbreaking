# Phase 2: get off the floor. Four guardrailed local models, borderline probe
# sets with mid-range baselines (XSTest), and a 30-probe codeword task.
run_name: phase2
# Optional second Ollama server so judging does not contend with generation:
#   CUDA_VISIBLE_DEVICES=1,2 OLLAMA_HOST=127.0.0.1:11435 OLLAMA_NUM_PARALLEL=8 ollama serve
concurrency: 8

# Targets and the judge are aliases from relbreak/fairlib.yml (converted from
# raw Ollama tags on 2026-09-23; the data rows of this run still carry the tags).
targets:
  - llama31_8b
  - llama3_8b
  - qwen25_14b
  - qwen3vl_8b
judge: judge
judge_rubric: v2

conditions: [none, neutral, positive, negative]
n_prefixes: 3
n_samples: 1

generation:
  temperature: 0.7
  rapport_max_tokens: 200
  probe_max_tokens: 256

tasks:
  xstest_safe:      # over-refusal: does rapport make the model less cautious?
    source: xstest
    limit: 100
  xstest_unsafe:    # genuinely unsafe contrast prompts
    source: xstest
    limit: 100
  secret:
    source: builtin
