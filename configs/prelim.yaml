# Preliminary run: two target models, full JBB-Behaviors set, one judge.
run_name: prelim
host: http://localhost:11434
# Optional second Ollama server so judging does not contend with generation:
#   CUDA_VISIBLE_DEVICES=1,2 OLLAMA_HOST=127.0.0.1:11435 OLLAMA_NUM_PARALLEL=8 ollama serve
judge_host: http://localhost:11435
concurrency: 8

targets:
  - llama3.1:8b
  - qwen2.5:14b
judge: qwen2.5:14b

conditions: [none, neutral, positive, negative]
n_prefixes: 3          # independently sampled rapport histories per condition
n_samples: 1           # probe generations per (prefix, probe, appeal)

generation:
  temperature: 0.7
  rapport_max_tokens: 200
  probe_max_tokens: 256

tasks:
  harmful:
    source: jbb
    limit: null        # null = all 100 behaviors
  secret:
    source: builtin
