# Tiny end-to-end smoke run (pipeline validation only, not evidence).
run_name: pilot
concurrency: 8
# Targets and the judge are aliases from relbreak/fairlib.yml (converted from
# raw Ollama tags on 2026-09-23; the data rows of this run still carry the tags).
targets: [llama31_8b]
judge: judge
conditions: [none, neutral, positive, negative]
n_prefixes: 2
n_samples: 1
generation: {temperature: 0.7, rapport_max_tokens: 200, probe_max_tokens: 256}
tasks:
  harmful: {source: jbb, limit: 10}
  secret: {source: builtin, limit: 4}
